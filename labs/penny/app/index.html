/* ---------- Planner: deterministic calculators ---------- */
const Planner = {
  matchGain: (income, from, to, cap) => income * (Math.min(to, cap) - Math.min(from, cap)) / 100,
  takeHome: (income, dPct, tax) => income * dPct / 100 / 12 * (1 - tax),

  phone.querySelectorAll('[data-perm]').forEach(b => b.onclick = () => decide(b.dataset.perm, b.dataset.choice, +b.dataset.turn));
  phone.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => undo(b.dataset.undo));
  phone.querySelectorAll('[data-forget]').forEach(b => b.onclick = () => { S.memory.splice(+b.dataset.forget, 1); save(); renderPhone(false); });

  phone.querySelectorAll('[data-askabout]').forEach(b => b.onclick = () => { S.tab = 'penny'; save(); renderPhone(); ask(b.dataset.askabout); });
  phone.querySelectorAll('[data-try]').forEach(r => r.oninput = () => { S.tryit[r.dataset.try] = +r.value; save(); renderPhone(false); });

  voice: () => `<h3>Coaching voice</h3><ul><li>Ask before telling. After every suggestion, one question about how it feels.</li><li>Offer a choice where one exists: 5% now, 6% in January.</li><li>Say "I would suggest" and "your call". Never "you should".</li><li>No guarantees, no promised returns. Projections are called assumptions on the chart.</li><li>Product decisions (a card, a refinance, a fund) are named as product decisions and handed to a licensed person.</li><li>Silence is a feature. Months with nothing to say collapse to one line.</li></ul>`,
  design: () => `<h3>Design principles</h3><ul><li><b>One tap, one answer.</b> Every tap returns exactly one thing and offers the next step.</li><li><b>Depth in the tabs, calm in the thread.</b> Money, Plan, and Activity carry the data; Penny carries one idea at a time.</li><li><b>Evidence on demand.</b> Who checked what is a question, not a banner.</li><li><b>Interactive where it teaches.</b> Sliders, tappable categories, what-if diffs.</li><li><b>Hairlines, not boxes.</b></li></ul>`,
  problem: () => `<h3>The problem</h3><p>Most people know what would improve their finances. Most do not do it. The gap is not information. The decision is never framed in their own numbers, the action lives in a portal they dread, and nobody follows through.</p><p><b>The unit of value is a completed action that improves an outcome.</b> A conversation is a means, never the product.</p>`,
  bet: () => `<h3>The bet</h3><p>An AI-native coach closes the gap if it finds the moment, frames one decision in the customer's numbers, asks how it feels, gets the action done with them, and keeps its word between sessions.</p><ul><li>Not a chatbot with account access.</li><li>Not a budgeting app.</li><li>Not a robo-advisor. Penny never picks funds or ranks products.</li></ul>`,
  team: () => `<h3>The team</h3><p>The work is split into specialists so each step is checkable. The customer can see who did what by asking. It is never in their face.</p><ul><li><b>Penny</b> talks and explains. Never computes, never acts.</li><li><b>Reader, Analyst, Watcher</b> observe and cite.</li><li><b>Planner</b> is deterministic code. The only source of numbers.</li><li><b>Guardian</b> checks scope and decides when silence is right.</li><li><b>Doer</b> is the only agent that changes anything, after permission.</li><li><b>Advisor desk</b> hands off to a licensed human with a brief.</li></ul>`,
  metrics: () => `<h3>Metrics</h3><p><b>North star:</b> outcome-improving actions completed per active customer per quarter, counted only if the projection improves and the action is not reversed within 30 days.</p><p><b>Guards:</b> 30-day reversal rate, escalation rate, complaint rate.</p><p><b>By stage:</b> moment open rate; documents linked; feelings answered; decision-to-action; adherence at 90 days.</p>`,
  guardrails: () => `<h3>Guardrails</h3><ul><li>Guidance yes; security selection, product ranking, and individualized advice no.</li><li>The model never computes a customer number. Planner does.</li><li>Only Doer changes anything, after Allow. Every action logged with who, when, undo.</li><li>Only real deadlines trigger a message. Quiet hours.</li><li>Memory is visible, cited, editable.</li><li>An eval suite runs on every prompt change: numbers match, scope holds, no guarantee language, escalations fire.</li></ul>`,
  ninety: () => `<h3>First 90 days</h3><ul><li><b>Weeks 1 to 3:</b> the loop for real on one workplace plan; calculators reviewed with compliance; Doer wired to contribution changes only.</li><li><b>Weeks 4 to 8:</b> two cohorts of 200, unenrolled and under-contributing. Measure decision-to-action and 30-day reversals.</li><li><b>Weeks 9 to 12:</b> savings and autopay through bank rails; advisor handoff rated by the advisors who receive it.</li></ul><p><b>Day 90 decision:</b> does a permissioned coach collect more match per participant than the best nudge campaign? If not, stop.</p>`,
