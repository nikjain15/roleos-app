<script>
/* Penny · minimalist build.
   Rules in code: Penny never computes a customer number (Planner does; each is a check the user can open).
   Only Doer changes anything, only after the customer allows it. Everything is logged. */
const I = {
  check: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>',
  chev: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 5l5 5-5 5"/></svg>',
  send: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10h13M11 5l5 5-5 5"/></svg>',
  clip: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M14 8l-6 6a3 3 0 0 1-4-4l7-7a2 2 0 0 1 3 3l-7 7a1 1 0 0 1-1.5-1.5L11 6"/></svg>',
  penny: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/><path d="M4 21h16"/></svg>',
  activity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg>',
  you: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
};
const fmt = n => Math.round(n).toLocaleString('en-US');
const fmtK = n => (Math.abs(n) >= 1000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, '') + 'k' : fmt(n));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Planner: deterministic calculators */
const Planner = {
  matchGain: (income, from, to, cap) => income * (Math.min(to, cap) - Math.min(from, cap)) / 100,
  takeHome: (income, dPct, tax) => income * dPct / 100 / 12 * (1 - tax),
  payoff(bal, apr, pay) { const r = apr / 12; if (pay <= bal * r) return { months: Infinity, interest: Infinity }; const n = -Math.log(1 - r * bal / pay) / Math.log(1 + r); return { months: Math.ceil(n), interest: pay * n - bal }; },
  fv: (annual, rate, years) => annual * ((Math.pow(1 + rate, years) - 1) / rate),
  fundMonths(target, cur, monthly, apy) { let b = cur, m = 0; while (b < target && m < 600) { b = b * (1 + apy / 12) + monthly; m++; } return m; },
  simulate(p, plan, years, ret, apy) {
    let cash = p.savings, retire = p.k401, card = p.card, loan = p.loan, home = p.homeFund, out = [];
    const matchPct = Math.min(plan.contribPct, p.matchCap);
    for (let m = 0; m <= years * 12; m++) {
      if (m % 12 === 0) out.push(cash + retire + home - card - loan);
      retire = retire * (1 + ret / 12) + p.income / 12 * (plan.contribPct + matchPct) / 100;
      let extra = 0;
      if (card > 0) { card = card * (1 + p.cardApr / 12) - plan.cardPayment; if (card < 0) { extra = -card; card = 0; } } else if (plan.redirect) extra = plan.cardPayment;
      home = home * (1 + apy / 12) + extra + plan.homeMonthly;
      cash = cash * (1 + (plan.hysa ? apy : 0.005) / 12) + plan.autosave;
      if (loan > 0) { loan = Math.max(0, loan * (1 + p.loanApr / 12) - p.loanMin); }
    }
    return out;
  },
};

/* personas, synthetic */
const PERSONAS = {
  jordan: { id: 'jordan', name: 'Jordan', age: 34, role: 'Product manager', segment: 'Mid career', income: 128000, tax: 0.25, essentials: 4600, buffer: 1000, free: 650, savings: 9000, k401: 41000, contribPct: 3, matchCap: 6, card: 6800, cardApr: 0.2499, cardMin: 210, loan: 0, loanApr: 0, loanMin: 0, homeFund: 14500, homeTarget: 60000,
    story: 'Contributes 3% with a 6% match available. Card at 24.99%. Saving for a first home. Acts, but does not sustain.',
    memory: [['Keep 1,000 in checking', 'you · Sept 2026'], ['Home fund is off-limits', 'you · Sept 2025'], ['Match: 100% up to 6%', 'plan document, p.12'], ['Essentials about 4,600 a month', '90 days of spending']] },
  maya: { id: 'maya', name: 'Maya', age: 26, role: 'Data analyst, first job', segment: 'Early career', income: 72000, tax: 0.21, essentials: 3000, buffer: 1000, free: 420, savings: 1200, k401: 0, contribPct: 0, matchCap: 4, card: 0, cardApr: 0, cardMin: 0, loan: 28400, loanApr: 0.055, loanMin: 310, homeFund: 0, homeTarget: 0, fundTarget: 9000, autosave: 230,
    story: 'Not enrolled in the 401(k). 1,200 in savings. Student loans. Has never acted; afraid of locking money away.',
    memory: [['Keep 1,000 in checking', 'you · Sept 2026'], ['Safety net is the goal this year', 'you · Sept 2026'], ['Match: 100% up to 4%', 'plan document, p.9'], ['Essentials about 3,000 a month', '90 days of spending']] },
};
function derive(p) {
  const d = {};
  if (p.id === 'jordan') {
    d.matchGain = Planner.matchGain(p.income, p.contribPct, p.matchCap, p.matchCap); d.takeHome = Planner.takeHome(p.income, p.matchCap - p.contribPct, p.tax);
    d.match10y = Planner.fv(d.matchGain, 0.06, 10); d.fast = Planner.payoff(p.card, p.cardApr, p.cardMin + 300); d.slow = Planner.payoff(p.card, p.cardApr, p.cardMin);
    d.saved = d.slow.interest - d.fast.interest; d.cardYear = p.card * p.cardApr; d.houseAll = p.homeFund * Math.pow(1.042, 4) + Planner.fv(p.free * 12, 0.042, 4); d.runway = p.savings / p.essentials;
  } else {
    d.matchGain = Planner.matchGain(p.income, 0, p.matchCap, p.matchCap); d.takeHome = Planner.takeHome(p.income, p.matchCap, p.tax); d.match10y = Planner.fv(d.matchGain, 0.06, 10);
    d.fundMonths = Planner.fundMonths(p.fundTarget, p.savings, p.autosave, 0.042); d.fundFast = Planner.fundMonths(p.fundTarget, p.savings, p.autosave + d.takeHome, 0.042); d.lost3y = Planner.fv(d.matchGain, 0.06, 3); d.runway = p.savings / p.essentials;
  }
  return d;
}

/* state */
let S = null;
function fresh(pid) {
  const p = PERSONAS[pid];
  return { persona: pid, tab: 'penny', notesTab: 'moment', stage: 'moment', date: 'Sept 9, 2026', thread: [], actions: [], rules: [], memory: p.memory.map(m => m.slice()),
    plan: { version: pid === 'jordan' ? 3 : 0, contribPct: p.contribPct, cardPayment: p.cardMin, autosave: 0, hysa: false, redirect: false, homeMonthly: 0 },
    assump: { ret: 0.06, apy: 0.042 }, live: { cash: p.savings, card: p.card, k401: p.k401, homeFund: p.homeFund, contribPct: p.contribPct, income: p.income },
    team: { Penny: 'idle', Reader: 'idle', Analyst: 'idle', Planner: 'idle', Guardian: 'idle', Doer: 'idle', Watcher: 'next check 7:40 tomorrow', 'Advisor desk': 'idle' } };

    return `<h3>${h}</h3><p>${body}</p>${bullets.length ? `<ul>${bullets.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}`;
  },
  design: () => `<h3>Design principles</h3><ul><li><b>One turn, one idea.</b> One or two sentences. Where a number matters it is the largest thing on screen, and there is only one.</li><li><b>Evidence on demand.</b> Who checked what folds into one quiet line. Tables and reasoning open only when asked.</li><li><b>One primary action.</b> A single button per turn, at most one text link beside it.</li><li><b>Permission as a calm sheet.</b> Title, three rows, Allow or Not now. Standing rules are a link, not a third button.</li><li><b>Product first.</b> These notes and the team panel are hidden until a reviewer asks.</li><li><b>Hairlines, not boxes.</b> Whitespace does the grouping.</li></ul>`,
  problem: () => `<h3>The problem</h3><p>Most people know what would improve their finances. Most do not do it. The gap is not information. The decision is never framed in their own numbers, the action lives in a portal they dread, and nobody follows through. Advice serves the top of the market; the rest get content.</p><p><b>The unit of value is a completed action that improves an outcome.</b> A conversation is a means, never the product.</p>`,
  bet: () => `<h3>The bet</h3><p>An AI-native coach closes the gap if it does four things a chatbot cannot: find the moment, frame one decision in the customer's numbers, get the action done with them, and keep its word between sessions.</p><ul><li>Not a chatbot with account access: every number comes from a calculator, every action from a permissioned tool.</li><li>Not a budgeting app: no categories, no streaks. One move at a time.</li><li>Not a robo-advisor: Penny never picks funds. That stays with a licensed human.</li></ul>`,
  team: () => `<h3>The team, and why it is visible</h3><p>One model that reads, computes, judges, and acts is hard to audit and easy to distrust. The work is split into specialists, and the customer can see who did what by opening the checks under any message. It is never in their face.</p><ul><li><b>Penny</b> talks and explains. Never computes, never acts.</li><li><b>Reader, Analyst, Watcher</b> observe and cite.</li><li><b>Planner</b> is deterministic code. The only source of numbers.</li><li><b>Guardian</b> checks scope before every message and decides when silence is right.</li><li><b>Doer</b> is the only agent that changes anything, after permission.</li><li><b>Advisor desk</b> hands off to a licensed human with a brief.</li></ul>`,
  metrics: () => `<h3>Metrics</h3><p><b>North star:</b> outcome-improving actions completed per active customer per quarter, counted only if Planner's projection improves and the action is not reversed within 30 days.</p><p><b>Guards:</b> 30-day reversal rate, advisor escalation rate, complaint rate.</p><p><b>By stage:</b> moment open rate; documents linked; decision-to-action; adherence at 90 days.</p><p><b>Not measured:</b> sessions, minutes, messages. A quiet coach that gets three actions done a year beats a chatty one.</p>`,
  guardrails: () => `<h3>Guardrails</h3><ul><li>Guidance yes; security selection and individualized advice no. Those go to a licensed advisor with a brief.</li><li>The model never computes a customer number. Planner does, and it is shown as a check.</li><li>Only Doer changes anything, after Allow. Every action logged with who, when, before, after, undo.</li><li>Only real deadlines trigger a message. One at a time. Quiet hours.</li><li>Memory is visible, cited, editable. Stale facts are re-asked.</li><li>An eval suite runs on every prompt change: numbers match, scope holds, escalations fire.</li></ul>`,
  ninety: () => `<h3>First 90 days</h3><ul><li><b>Weeks 1 to 3:</b> the loop for real, one workplace plan, Reader on real plan documents, calculators reviewed with compliance, Doer wired to contribution changes only.</li><li><b>Weeks 4 to 8:</b> two cohorts of 200: unenrolled and under-contributing participants. Measure decision-to-action and 30-day reversals.</li><li><b>Weeks 9 to 12:</b> the second action through bank rails, and the advisor handoff rated by the advisors who receive it.</li></ul><p><b>Day 90 decision:</b> does a permissioned coach capture more match per participant than the best nudge campaign Fidelity has run? If not, stop.</p>`,
  cut: () => `<h3>What I would cut</h3><ul><li>The general chatbot. Free text is a side door, not the product.</li><li>Budget categories and streaks. They measure attention, not outcomes.</li><li>Investment selection, ever.</li><li>Any dashboard card that cannot be traced to a decision in the thread.</li><li>Any notification Guardian would not let through.</li></ul>`,
};
function renderNotes() {
  const el = document.getElementById('notes'); if (!el.classList.contains('open')) { el.innerHTML = ''; return; }
  const tabs = [['moment', S && S.tab !== 'penny' ? 'This tab' : 'This moment'], ['design', 'Design'], ['problem', 'Problem'], ['bet', 'Bet'], ['team', 'Team'], ['metrics', 'Metrics'], ['guardrails', 'Guardrails'], ['ninety', '90 days'], ['cut', 'Cut']];
  const cur = S ? S.notesTab : notesFallback;
  el.innerHTML = `<div class="card"><div class="notes-tabs">${tabs.map(([id, l]) => `<button class="${cur === id ? 'on' : ''}" data-note="${id}">${l}</button>`).join('')}</div><div class="note-body">${NOTES[cur]()}</div></div>
    ${S ? `<div class="card"><span class="xs">Team, right now</span>${Object.entries(S.team).map(([n, s]) => `<div class="team-row"><span>${n}</span><span class="st ${s === 'working' ? 'busy' : ''}">${esc(s)}</span></div>`).join('')}</div>
    <div class="card"><span class="xs">Guided path</span><p class="sm">${S.persona === 'jordan' ? 'Show me → Do this → Allow, Allow → Skip ahead → Skip ahead → Allow → Skip ahead → Book an advisor. Or type anything.' : 'Read my documents → 1,000 → Do this → Allow, Allow → Skip ahead → Skip ahead → Allow. Or type anything.'}</p><p class="xs">Free-text replies: ${sampleFn === undefined ? 'checking' : sampleFn && S.liveOn !== false ? 'live' : 'scripted'}, labelled either way.</p></div>` : ''}`;
  el.querySelectorAll('[data-note]').forEach(b => b.onclick = () => { if (S) S.notesTab = b.dataset.note; else notesFallback = b.dataset.note; renderNotes(); });
}
let notesFallback = 'design';
function choose(pid) { S = fresh(pid); renderAll(); setTimeout(startMoment, 350); }
function renderAll() { renderTop(); renderPhone(); renderNotes(); }
S = load(); renderAll();
</script>
