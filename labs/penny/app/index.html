<title>Penny</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>

  .appbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; background: var(--ground); }
  .appbar .who { display: flex; align-items: center; gap: 8px; }

  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--surface); }
  .tabs button { min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .tabs button svg { width: 22px; height: 22px; }
  .tabs button.on { color: var(--primary); }
  .composer { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border-top: 1px solid var(--line); }
  .composer input { flex: 1; min-height: 44px; border: 1px solid var(--line-2); border-radius: 999px; padding: 0 14px; font: inherit; background: var(--surface-2); color: var(--ink); }
  .composer input::placeholder { color: var(--muted); }
  .composer button { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
  .composer button.send { background: var(--primary); color: #fff; }

  .turn .who b { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
  .turn .who .t { font-size: 12px; color: var(--muted); }
  .turn .live { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--lime); color: var(--lime-ink); }
  .turn .demo { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .agent-text { font-size: 15px; }
  .agent-text b { font-weight: 700; }
  .user { align-self: flex-end; max-width: 84%; background: var(--ink); color: #fff; border-radius: 18px 18px 4px 18px; padding: 10px 14px; }
  .user.att { display: flex; align-items: center; gap: 8px; }

  .result .h { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #145C3B; }

  .divider { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px dashed var(--line-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .chip.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chip.accent { border-color: var(--primary); color: var(--primary); }
  .chip.lime { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }

  /* ---------- tab views ---------- */

  .status.applied { background: var(--good-soft); color: #145C3B; }
  .status.scheduled { background: var(--primary-soft); color: var(--primary); }
  .status.waiting { background: var(--surface-2); color: var(--muted); }
  .status.proposed { background: var(--warn-soft); color: #7A4E07; }
  .status.undone { background: var(--bad-soft); color: #8A2323; }
  .who-row { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); }
  .steps { display: flex; flex-direction: column; gap: 8px; }
  .step { display: flex; align-items: center; gap: 10px; }
  .step .dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex-shrink: 0; }
  .step.done .dot { background: var(--good); border-color: var(--good); color: #fff; }
  .step .dot svg { width: 12px; height: 12px; }
  .assump { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .assump input[type=range] { flex: 1; accent-color: var(--primary); }
  .team-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: start; font-size: 13px; color: var(--ink-2); }
  .fact { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .fact .src { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chart-wrap { position: relative; }
  .chart-tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 8px; border-radius: 8px; transform: translate(-50%, -110%); white-space: nowrap; display: none; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

  /* ---------- picker ---------- */
  .picker { position: absolute; inset: 0; background: var(--ground); z-index: 4; display: flex; flex-direction: column; gap: 14px; padding: 28px 20px; overflow-y: auto; }
  .picker h2 { font-size: 24px; }
  .persona { text-align: left; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-card); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .persona:hover { border-color: var(--primary); }
  .persona .n { font-family: var(--font-display); font-weight: 600; font-size: 16px; }

  /* ---------- team + notes columns ---------- */
  .team-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
  .team-row .st { margin-left: auto; font-size: 12px; color: var(--muted); }
  .team-row .st.busy { color: var(--primary); font-weight: 600; }
  .notes-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .notes-tabs button { min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .notes-tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .note-body { display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: var(--ink); max-width: 62ch; }
  .note-body h3 { font-size: 15px; }

  .note-body .callout { background: var(--primary-soft); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
  .sheet { position: absolute; inset: 0; background: rgba(23,24,43,0.35); z-index: 3; display: flex; align-items: flex-end; }
  .sheet .panel { background: var(--surface); border-radius: 22px 22px 0 0; padding: 14px 16px 20px; width: 100%; max-height: 82%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

  .btn { min-height: 46px; border-radius: var(--r-btn); display: flex; align-items: center; justify-content: center; font-weight: 600; border: 1px solid var(--line-2); background: var(--surface); }
  .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
</style>

<div class="top">

</div>
<div class="shell">
  <div class="col-app"><div class="phone" id="phone"></div></div>

<script>
/* =========================================================
   Penny · AI money coach prototype
   Rules encoded here: Penny (the model) never computes a customer number.
   Every figure comes from the calculators below (Planner) and is shown as a tool call.
   Only Doer changes anything, only after a permission prompt. Everything is logged.
   ========================================================= */
const ICON = {
  check: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>',
  chev: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 5l5 5-5 5"/></svg>',
  doc: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 2h7l4 4v12H5z"/><path d="M12 2v4h4M8 10h5M8 13h5"/></svg>',
  mic: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="7" y="2" width="6" height="10" rx="3"/><path d="M4 9a6 6 0 0 0 12 0M10 15v3"/></svg>',
  send: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10h13M11 5l5 5-5 5"/></svg>',
  clip: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M14 8l-6 6a3 3 0 0 1-4-4l7-7a2 2 0 0 1 3 3l-7 7a1 1 0 0 1-1.5-1.5L11 6"/></svg>',
  tabPenny: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  tabOverview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
  tabPlan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/><path d="M4 21h16"/></svg>',
  tabActions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg>',
  tabYou: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
};
const fmt = n => Math.round(n).toLocaleString('en-US');
const fmtK = n => (Math.abs(n) >= 1000 ? (n/1000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, '') + 'k' : fmt(n));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Planner: deterministic calculators ---------- */
const Planner = {
  matchGain(income, fromPct, toPct, capPct) { const a = Math.min(fromPct, capPct), b = Math.min(toPct, capPct); return income * (b - a) / 100; },
  takeHomeCost(income, deltaPct, taxRate) { return income * deltaPct / 100 / 12 * (1 - taxRate); },
  payoff(balance, apr, payment) {
    const r = apr / 12; if (payment <= balance * r) return { months: Infinity, interest: Infinity };
    const n = -Math.log(1 - r * balance / payment) / Math.log(1 + r);
    return { months: Math.ceil(n), interest: payment * n - balance };
  },
  fvAnnuity(annual, rate, years) { return annual * ((Math.pow(1 + rate, years) - 1) / rate); },
  fundMonths(target, current, monthly, apy) { let b = current, m = 0; while (b < target && m < 600) { b = b * (1 + apy / 12) + monthly; m++; } return m; },
  runway(cash, essentials) { return cash / essentials; },
  simulate(p, plan, years, ret, apy) {
    let cash = p.savings, retire = p.k401, card = p.card, loan = p.loan, home = p.homeFund, out = [];
    const matchPct = Math.min(plan.contribPct, p.matchCap);
    for (let m = 0; m <= years * 12; m++) {
      if (m % 12 === 0) out.push(cash + retire + home - card - loan);
      retire = retire * (1 + ret / 12) + p.income / 12 * (plan.contribPct + matchPct) / 100;
      let extra = 0;
      if (card > 0) { card = card * (1 + p.cardApr / 12) - plan.cardPayment; if (card < 0) { extra = -card; card = 0; } }
      else if (plan.redirect) extra = plan.cardPayment;
      home = home * (1 + apy / 12) + extra + plan.homeMonthly;
      cash = cash * (1 + (plan.hysa ? apy : 0.005) / 12) + plan.autosave;
      if (loan > 0) { loan = loan * (1 + p.loanApr / 12) - p.loanMin; if (loan < 0) loan = 0; }
    }
    return out;
  },
};

/* ---------- derived numbers per persona (Planner runs once, reused everywhere) ---------- */
function derive(p) {
  const d = {};
  if (p.id === 'jordan') {
    d.matchGain = Planner.matchGain(p.income, p.contribPct, p.matchCap, p.matchCap);            // 3,840
    d.takeHome = Planner.takeHomeCost(p.income, p.matchCap - p.contribPct, p.taxRate);           // 240
    d.matchMonthly = p.income * (p.matchCap - p.contribPct) / 100 / 12;                         // 320
    d.match10y = Planner.fvAnnuity(d.matchGain, 0.06, 10);                                      // ~50.6k
    d.payFast = Planner.payoff(p.card, p.cardApr, p.cardMin + 300);                             // 16 mo
    d.paySlow = Planner.payoff(p.card, p.cardApr, p.cardMin);                                   // 55 mo
    d.interestSaved = d.paySlow.interest - d.payFast.interest;                                  // ~3.4k
    d.cardCostYear = p.card * p.cardApr;                                                        // ~1,700
    d.houseAll = p.homeFund * Math.pow(1 + 0.042, 4) + Planner.fvAnnuity(p.freeCash * 12, 0.042, 4); // ~51k
    d.runway = Planner.runway(p.savings, p.essentials);                                         // 1.96
    d.sooner = Planner.payoff(p.card, p.cardApr, p.cardMin);
  } else {
    d.matchGain = Planner.matchGain(p.income, 0, p.matchCap, p.matchCap);                       // 2,880
    d.takeHome = Planner.takeHomeCost(p.income, p.matchCap, p.taxRate);                         // ~190
    d.match10y = Planner.fvAnnuity(d.matchGain, 0.06, 10);                                      // ~38k
    d.fundMonths = Planner.fundMonths(p.fundTarget, p.savings, p.autosave, 0.042);              // ~33-34
    d.fundMonthsNoMatch = Planner.fundMonths(p.fundTarget, p.savings, p.autosave + d.takeHome, 0.042); // if she skipped the match
    d.runway = Planner.runway(p.savings, p.essentials);                                         // 0.4
    d.lostMatch3y = Planner.fvAnnuity(d.matchGain, 0.06, 3);
  }
  return d;
}

function renderThread() {
  return S.thread.map((turn, i) => {
    if (turn.type === 'notif') return `<div class="notif rise"><div class="mark">P</div><div><div class="sm"><b>Penny</b> · now</div><p>${esc(turn.text)}</p></div></div>`;
    if (turn.type === 'divider') return `<div class="divider">${esc(turn.text)}</div>`;
    if (turn.type === 'user') return `<div class="user ${turn.att ? 'att' : ''} rise">${turn.att ? ICON.doc : ''}<span>${esc(turn.text)}</span></div>`;
    const blocks = turn.blocks.map((b, j) => renderBlock(b, i, j)).join('');
    return `<div class="turn rise" data-turn="${i}"><div class="who"><div class="mark">P</div><b>Penny</b><span class="t">${esc(turn.time)}</span>${turn.live ? '<span class="live">live</span>' : turn.demo ? '<span class="demo">scripted</span>' : ''}</div>${blocks}</div>`;
  }).join('');
}
function renderBlock(b, i, j) {
  switch (b.t) {
    case 'text': return `<div class="agent-text">${b.html}</div>`;
    case 'tool': return `<div class="tool">${b.running ? '<span class="spin"></span>' : `<span class="ok">${ICON.check}</span>`}<span class="tag">${esc(b.agent)}</span><span><span class="name">${esc(b.name)}</span> <span class="res">· ${esc(b.res)}</span></span></div>`;
    case 'think': return `<div class="think ${b.open ? 'open' : ''}" data-think="${i}:${j}"><button class="toggle">${ICON.chev}Penny thought for a few seconds</button><div class="lines">${b.lines.map(l => `<div>${esc(l)}</div>`).join('')}</div></div>`;
    case 'table': return `<div class="card" style="padding:6px 4px"><table class="tbl"><tr>${b.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr>${b.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
    case 'artifact': return `<button class="artifact" data-open="${b.tab}"><div class="doc"></div><div><div><b>${esc(b.title)}</b></div><div class="sm">${esc(b.sub)}</div></div><span class="go">${ICON.chev}</span></button>`;
    case 'perm': return `<div class="perm ${b.decided ? 'done' : ''}"><div class="who-row"><span class="tag">${esc(b.agent)}</span><span>wants to</span></div><div><b>${esc(b.title)}</b></div><div class="sm">${esc(b.sub)}</div>${b.decided ? `<div class="decided"><span class="ok" style="color:var(--good);width:16px;height:16px;display:inline-flex">${ICON.check}</span>You chose: ${esc(b.decided)}</div>` : `<div class="opts">${b.opts.map((o, k) => `<button class="${o.primary ? 'primary' : ''}" data-perm="${b.id}" data-opt="${k}" data-turn="${i}">${esc(o.label)}</button>`).join('')}</div>`}</div>`;
    case 'result': return `<div class="result"><div class="h">${ICON.check}<span>${esc(b.title)}</span></div><div class="sm">${esc(b.sub)}</div>${b.links.length ? `<div class="links">${b.links.map(l => `<button data-link="${esc(l)}" data-turn="${i}">${esc(l)}</button>`).join('')}</div>` : ''}</div>`;
    case 'waiting': return `<div class="waiting"><b>${esc(b.title)}</b><div class="sm">${esc(b.sub)}</div></div>`;
    case 'chips': return `<div class="chips">${b.items.map(c => `<button class="chip ${c.kind || ''}" data-act="${c.act}" data-turn="${i}" data-label="${esc(c.label)}" ${b.used ? 'disabled' : ''}>${esc(c.label)}</button>`).join('')}</div>`;
    default: return '';
  }
}
function bindThread() {
  phone.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const act = b.dataset.act;
    if (act === 'v4') { S.thread[+b.dataset.turn].blocks.forEach(x => { if (x.t === 'chips') x.used = 'v4'; }); S.thread.push({ type: 'user', text: b.dataset.label }); S.plan.version = 4; S.plan.log.unshift({ v: 4, when: S.date, by: 'Planner', what: 'You chose the house by 2029; card stays at minimum; 1,150 a month to the home fund from January.' }); push(agentTurn('now', [T.tool('Planner', 'Rebuilt plan', 'v4 · house by 2029'), T.text('Plan v4 is built around 2029. I have written the interest cost into the change log so future-you knows it was a choice, not an accident.'), T.artifact('Plan v4', 'House by 2029 · card at minimum · assumptions', 'plan')])); return; }
    if (act === 'keep') { S.thread[+b.dataset.turn].blocks.forEach(x => { if (x.t === 'chips') x.used = 'keep'; }); S.thread.push({ type: 'user', text: b.dataset.label }); push(agentTurn('now', [T.text('Keeping v3. If 2029 comes back up, the numbers will still be here.')])); return; }
    chipAct(act, +b.dataset.turn, b.dataset.label);
  });
  phone.querySelectorAll('[data-perm]').forEach(b => b.onclick = () => decide(b.dataset.perm, +b.dataset.opt, +b.dataset.turn));
  phone.querySelectorAll('[data-open]').forEach(b => b.onclick = () => switchTab(b.dataset.open));
  phone.querySelectorAll('[data-think]').forEach(el => el.querySelector('.toggle').onclick = () => { const [i, j] = el.dataset.think.split(':').map(Number); S.thread[i].blocks[j].open = !S.thread[i].blocks[j].open; save(); renderPhone(false); });
  phone.querySelectorAll('[data-link]').forEach(b => b.onclick = () => {
    const l = b.dataset.link;
    if (l === 'Undo') { const turnIdx = +b.dataset.turn; const prior = S.thread.slice(0, turnIdx).reverse().find(t => t.type === 'agent' && t.blocks.some(x => x.t === 'perm' && x.decided)); const perm = prior && prior.blocks.find(x => x.t === 'perm' && x.decided); if (perm) undo(perm.id); }
    else if (l === 'Pause') push(agentTurn('now', [T.tool('Doer', 'Paused', 'autopay · resumes when you say'), T.text('Paused. Nothing moves until you say so. The plan date slips by a month for each month paused; I will show that in Plan.')]));
    else switchTab('actions');
  });
  phone.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => undo(b.dataset.undo));
  phone.querySelectorAll('[data-ret]').forEach(r => r.oninput = () => { S.assump.ret = +r.value / 100; save(); renderPhone(false); });
  phone.querySelectorAll('[data-forget]').forEach(b => b.onclick = () => { S.memory.splice(+b.dataset.forget, 1); save(); renderPhone(false); });
  phone.querySelectorAll('[data-revoke]').forEach(b => b.onclick = () => { S.allow.splice(+b.dataset.revoke, 1); save(); renderPhone(false); });
  phone.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => switchTab(b.dataset.goto));
  bindChart();
}

function renderChart(a, b) {
  const W = 340, H = 170, L = 40, R = 12, Tt = 12, B = 26;
  const all = a.concat(b), max = Math.max(...all), min = Math.min(0, ...all);
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, Math.abs(v))))); return Math.ceil(v / p) * p; };
  const yMax = nice(max), yMin = min < 0 ? -nice(-min) : 0;
  const x = i => L + (W - L - R) * i / 10, y = v => Tt + (H - Tt - B) * (1 - (v - yMin) / (yMax - yMin));
  const path = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const ticks = [yMin, (yMin + yMax) / 2, yMax];
  window._chart = { a, b, x, y, L, R, W };
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Projected net worth over ten years, with the plan versus if nothing changes" id="chart">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="#E4E5EF" stroke-width="1"/><text x="${L - 6}" y="${(y(t) + 4).toFixed(1)}" font-size="10" text-anchor="end" fill="#7A7E94">${fmtK(t)}</text>`).join('')}
    ${[0, 5, 10].map(i => `<text x="${x(i).toFixed(1)}" y="${H - 8}" font-size="10" text-anchor="${i === 0 ? 'start' : i === 10 ? 'end' : 'middle'}" fill="#7A7E94">${i === 0 ? 'now' : i + ' yrs'}</text>`).join('')}
    <path d="${path(b)}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${path(a)}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>
    <circle cx="${x(10).toFixed(1)}" cy="${y(b[10]).toFixed(1)}" r="4" fill="var(--series-1)" stroke="#fff" stroke-width="2"/>
    <circle cx="${x(10).toFixed(1)}" cy="${y(a[10]).toFixed(1)}" r="4" fill="var(--series-2)" stroke="#fff" stroke-width="2"/>
    <line id="xhair" x1="0" x2="0" y1="${Tt}" y2="${H - B}" stroke="#17182B" stroke-width="1" stroke-dasharray="2 3" style="display:none"/>
  </svg><div class="chart-tip" id="tip"></div></div>`;
}
function bindChart() {
  const svg = phone.querySelector('#chart'); if (!svg || !window._chart) return;
  const tip = phone.querySelector('#tip'), xh = svg.querySelector('#xhair'), c = window._chart;
  const move = ev => {
    const rect = svg.getBoundingClientRect(); const px = (ev.clientX - rect.left) / rect.width * c.W;
    const i = Math.max(0, Math.min(10, Math.round((px - c.L) / (c.W - c.L - c.R) * 10)));
    xh.setAttribute('x1', c.x(i)); xh.setAttribute('x2', c.x(i)); xh.style.display = '';
    tip.style.display = 'block'; tip.style.left = (c.x(i) / c.W * 100) + '%'; tip.style.top = '8px';
    tip.innerHTML = `<b>${i === 0 ? 'now' : 'year ' + i}</b> · with plan ${fmtK(c.b[i])} · without ${fmtK(c.a[i])}`;
  };
  svg.addEventListener('mousemove', move); svg.addEventListener('touchmove', e => move(e.touches[0]), { passive: true });
  svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; xh.style.display = 'none'; });
}

    <div class="eyebrow">You · memory, the team, permissions</div>
    <div class="card"><div class="stat"><b>What Penny knows about you</b></div>${S.memory.map((m, i) => `<div class="fact"><span>${esc(m.fact)}${m.inferred ? ' <span class="xs">(inferred)</span>' : ''}</span><span class="src">${esc(m.src)} · <button class="linkbtn" data-forget="${i}">forget</button></span></div>`).join('')}</div>
    <div class="card"><b>Meet the team</b><div class="sm">Specialists Penny calls. Their name is on every step.</div><div class="team-grid">${team.map(([n, d]) => `<span class="tag">${n}</span><span>${d}</span>`).join('')}</div></div>
    <div class="card"><b>What the team may do</b><table class="tbl">
      <tr><th style="width:34%">Always allowed</th><td>Reader, Analyst, Watcher: read linked accounts and documents · Planner: run calculators · Penny: prepare proposals, find moments (quiet 9pm to 8am)</td></tr>
      <tr><th>Ask every time</th><td>Doer: change a contribution · change an autopay · open or move savings · Advisor desk: book an advisor</td></tr>
      <tr><th>Allowed within a cap</th><td>${S.allow.length ? S.allow.map((a, i) => `${esc(a.cap)} <span class="xs">(since ${esc(a.since)})</span> · <button class="linkbtn" data-revoke="${i}">revoke</button>`).join('<br>') : 'none yet'}</td></tr>
      <tr><th>Never, by design</th><td>Move money without asking · pick funds or securities · give individualized investment advice · sell a product · hide a fee</td></tr></table></div>
    <div class="card soft"><div class="sm"><b>Data the team can see:</b> ${P().id === 'jordan' ? '4 accounts · 2 documents' : '3 accounts · 2 documents'} · 90 days of transactions. <button class="linkbtn">Disconnect</button> · <button class="linkbtn">Export</button> · <button class="linkbtn">Delete everything</button></div></div>
    <p class="xs">Memory, the team roster, and the allowlist live together because they answer the one question that matters for trust: who knows what, and who may do what.</p>`;
}

/* ---------- team sheet (phone) and team column (desktop) ---------- */
function openTeamSheet() {
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  sheet.innerHTML = `<div class="panel"><div class="handle"></div><b>Team · who is working right now</b>${teamRows()}<button class="btn" id="closeSheet">Close</button></div>`;
  phone.appendChild(sheet);
  sheet.querySelector('#closeSheet').onclick = () => sheet.remove();
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.remove(); });
}
function teamRows() { return Object.entries(S.team).map(([n, s]) => `<div class="team-row"><span class="tag">${n}</span><span class="st ${s === 'working' ? 'busy' : ''}">${esc(s)}</span></div>`).join(''); }
function renderTeam() {
  const el = document.getElementById('teamCol');
  if (!S) { el.innerHTML = `<div class="eyebrow">Team</div><p class="sm">Pick a persona to see who is working.</p>`; return; }
  const p = P();
  el.innerHTML = `<div class="eyebrow">Team · who is working right now</div><div class="card">${teamRows()}</div>
    <div class="eyebrow">Persona</div><div class="card"><b>${p.name}, ${p.age} · ${p.segment}</b><div class="sm">${esc(p.story)}</div><div class="xs">All figures synthetic. ${p.returning ? 'Returning user: accounts linked last year, memory holds one hard constraint.' : 'First session: nothing linked, nothing remembered yet.'}</div></div>
    <div class="eyebrow">Guided path</div><div class="card"><div class="sm">${p.id === 'jordan' ? 'Lay it out → Still true → Turn into actions → Allow once, twice → Jump ahead → Allow → Jump ahead → Book an advisor.' : 'Show me → Attach → 1,000 → Show me the plan → Lay it out → Turn into actions → Allow once, twice → Jump ahead → Jump ahead → Allow once.'}</div><div class="xs">Or type anything into the composer at any point. Free-text replies are live when Claude access is available, scripted otherwise, and labelled either way.</div></div>`;
}

/* ---------- product notes ---------- */
const NOTES = {
  moment: () => {
    const map = {
      moment: ['The moment', 'People do not fail to improve their finances for lack of information. They fail between knowing and doing. So the product does not start with a dashboard or a login. It starts with a message, timed to a real deadline, in the customer\'s own number, with the evidence attached.', ['Hypothesis: a moment with a real deadline and a visible reason opens at 3x the rate of a generic nudge.', 'Guardrail: one moment at a time, only real deadlines, back off after two ignores, quiet hours.', 'Metric: moment open rate, time to first plan.']],
      memory: ['Memory as a visible step', 'A returning customer should never re-explain themselves, and should never be surprised by what the coach assumed. So memory is quoted back with its source and date, and stale facts are re-asked rather than used.', ['Hypothesis: confirmations and corrections raise trust; a correction is a win, not a failure.', 'Guardrail: facts older than a year are re-asked. Memory is editable in the You tab.']],
      understand: ['Documents, not forms', 'The benefits portal loses people at screen three. Penny asks for the PDF and the paystub, and Reader does the work with page citations. The customer answers only what nobody can read: the buffer they need to feel safe.', ['Hypothesis: document-first onboarding completes at 2x the rate of form-first.', 'Guardrail: every extracted fact shows its source and can be corrected in place.', 'Metric: documents and accounts linked per user.']],
      plan: ['A living plan', 'The plan is an artifact Planner maintains and Penny explains. It has a version and a change log that says why it changed. What-if is a sentence typed into the thread, and the answer is a diff, not a calculator page.', ['Hypothesis: what-if runs are the engagement signal that predicts action, not sessions.', 'Guardrail: assumptions are visible and editable. No number is generated by the model.']],
      decide: ['One proposal, shown working', 'A tips feed puts the burden on the customer. Penny frames one trade-off in their numbers, shows its thinking, names which specialist produced each figure, states confidence, and says what would change its mind. Challenging it is typing a sentence.', ['Hypothesis: a challengeable proposal with visible reasoning doubles decision-to-action versus a tips feed. Baseline measured in the first cohort.', 'Guardrail: Guardian runs before every proposal. Fund selection escalates to a licensed advisor.', 'Metric: decision-to-action rate; challenge rate (healthy at 20 to 40%).']],
      act: ['Permission before action', 'This is the Claude Code permission prompt applied to money. Doer is the only specialist that can change anything, and it asks first: allow once, always allow within a cap, or deny. Every result has a receipt and an undo. Caps are visible in the You tab and revocable.', ['Hypothesis: named, visible division of labor raises acceptance and lowers reversals versus an unnamed assistant.', 'Guardrail: nothing moves money without a confirm. 30-day easy undo.', 'Metric: north star, outcome-improving actions completed per active customer per quarter. Guard: 30-day reversal rate.']],
      away: ['Work between sessions', 'The team keeps working when the customer is not there, and shows it as timestamped turns: verified the change landed, confirmed the payment cleared, and, deliberately, "nothing worth a message". Restraint is a feature. Deferred actions re-ask; nothing fires on a stale instruction.', ['Hypothesis: a quiet coach that speaks only when it matters retains at 90 days where a chatty one churns.', 'Guardrail: frequency cap, and a licensed human for anything individualized, with a brief already written.', 'Metric: plan adherence at 90 days; advisor-rated handoff quality.']],
    };
    const tabMap = { overview: ['The dashboard is downstream', 'The Overview never proposes anything. It shows what the thread decided and what the team did this week, and every card links back to the conversation. Putting the dashboard second is the point: the product is the loop, not the report.', ['What I would cut: any card here that cannot be traced to a thread decision.']], plan: ['The plan tab is the artifact, full size', 'Read and edit here; change it in the thread. The chart is Planner\'s simulation, and the return slider proves it: move it and every point recomputes deterministically.', ['Guardrail: two series, direct labels, one axis. Assumptions stated on the chart.']], actions: ['The audit log in user language', 'Who asked, who allowed, who did it, who verified it, and a way back. The compliance reviewer sees this same view. That is the whole point of typed actions.', ['Metric: 30-day reversal rate, the guard on the north star.']], you: ['Who knows what, and who may do what', 'Memory, the team roster, and the allowlist live together because together they answer the only trust question that matters. Inferred facts are marked inferred and can be forgotten.', ['Guardrail: "never, by design" is enforced in code, not in copy.']] };
    const [h, body, bullets] = S && S.tab !== 'penny' ? tabMap[S.tab] : map[S ? S.stage : 'moment'] || map.moment;
    return `<h3>${h}</h3><p>${body}</p><ul>${bullets.map(b => `<li>${b}</li>`).join('')}</ul>`;
  },
  problem: () => `<h3>The problem</h3><p>Most people know what would improve their finances: take the match, clear the expensive debt, hold three months of essentials. Most do not do it. The gap is not information. It is that the decision is never framed in their own numbers, the action lives in a portal they dread, and nobody follows through.</p><p>Advice serves the top of the market. The rest get content. Fidelity's workplace footprint reaches tens of millions of participants, most of whom will never sit with an advisor. That is the population Penny is built for.</p><div class="callout">The unit of value is a completed action that improves an outcome. A conversation is a means, never the product.</div>`,
  bet: () => `<h3>The bet</h3><p>An AI-native coach can close the knowing-doing gap if it does four things a chatbot cannot: find the moment, frame one decision in the customer's numbers, get the action done with them, and keep its word between sessions.</p><ul><li><b>Not a chatbot with account access.</b> The thread is the spine, but every number comes from a calculator and every action from a typed, permissioned tool.</li><li><b>Not a budgeting app.</b> No categories, no streaks. One move a week.</li><li><b>Not a robo-advisor.</b> Penny never picks funds. That stays with a licensed human, reached with a brief already written.</li></ul><p>What I would build first: the two journeys in this prototype, end to end, for real participants, with the workplace plan as the first data source because it is the one Fidelity already holds.</p>`,
  team: () => `<h3>Why a visible team</h3><p>One model that reads, computes, judges, and acts is impossible to audit and easy to distrust. Splitting the work into specialists makes each step checkable, and showing the specialist's name on every step turns architecture into trust.</p><ul><li><b>Penny</b> talks, frames, explains, remembers. Never computes, never acts.</li><li><b>Reader, Analyst, Watcher</b> observe and cite. Cannot act.</li><li><b>Planner</b> is deterministic code with unit tests. The only source of customer numbers.</li><li><b>Guardian</b> runs scope and suitability checks before every proposal and every moment, and decides when silence is the right answer.</li><li><b>Doer</b> is the only agent that can change anything, and only after a permission prompt.</li><li><b>Advisor desk</b> prepares the handoff to a licensed human.</li></ul><p>Borrowed deliberately from how Claude Code shows subagents and permission prompts, because that pattern already earns trust with people who are careful about what runs on their machine. Money deserves at least that.</p>`,
  metrics: () => `<h3>Metrics</h3><p><b>North star:</b> outcome-improving actions completed per active customer per quarter. An action counts only if Planner's projection improves and it is not reversed within 30 days.</p><p><b>Guards:</b> 30-day reversal rate · advisor escalation rate · complaint rate · projected-outcome delta.</p><p><b>Leading indicators by stage:</b></p><ul><li>Moment open rate; time to first plan</li><li>Documents and accounts linked per user; correction rate on extracted facts</li><li>Plan viewed within 24 hours; what-if runs per user</li><li>Decision-to-action rate; challenge rate (healthy at 20 to 40%)</li><li>Plan adherence at 90 days; advisor-rated handoff quality</li></ul><p><b>What I would not measure:</b> sessions, minutes in app, messages sent. A quiet coach that gets three actions done a year beats a chatty one.</p>`,
  guardrails: () => `<h3>Guardrails</h3><ul><li><b>Scope.</b> Education and guidance, yes. Security selection and individualized investment advice, no. Those route to a licensed advisor through Advisor desk, with a brief.</li><li><b>Math.</b> The model never computes a customer number. Planner does, deterministically, and the number appears as a tool call the customer can see.</li><li><b>Action.</b> Only Doer changes anything, only after a permission prompt: allow once, always allow within a cap, deny. Every action logged with before, after, who, when, undo.</li><li><b>Moments.</b> Only real deadlines. One at a time. Back off after two ignores. Quiet hours.</li><li><b>Memory.</b> Visible, cited, editable. Inferred facts marked inferred. Stale facts re-asked.</li><li><b>Evals.</b> A suite runs on every prompt change: numbers match calculators, scope rules hold, escalations fire, tone stays plain.</li></ul>`,
  system: () => `<h3>The system under the loop</h3><ul><li><b>Context layer:</b> linked accounts, plan documents, paystubs, statements, memory with provenance.</li><li><b>Calculators (Planner):</b> match capture, payoff schedules, runway, projections, paycheck effect. Unit-tested. In this prototype they run in the page; every figure you see came from them.</li><li><b>Reasoning (Penny):</b> a model that finds the moment, frames the trade-off, writes the explanation, asks the clarifying question, revises on challenge. Reads calculator output; never replaces it.</li><li><b>Typed actions (Doer):</b> a small vocabulary with schemas, a confirm, and an undo, executed through the plan provider and the bank.</li><li><b>Audit and evals (Guardian):</b> every action logged; every prompt change evaluated.</li></ul><p>In this prototype, free-text replies use live Claude access when the viewer has it, under the same rules, with a scripted fallback so the demo never stalls. Both are labelled.</p>`,
  ninety: () => `<h3>First 90 days</h3><ul><li><b>Weeks 1 to 3: the loop, for real.</b> One workplace plan as the data source, Reader on real plan documents, Planner's calculators reviewed by a compliance partner, Doer wired to contribution changes only.</li><li><b>Weeks 4 to 8: two cohorts.</b> 200 unenrolled participants (Maya) and 200 under-contributing participants (Jordan). Measure decision-to-action and 30-day reversal.</li><li><b>Weeks 9 to 12: the second action.</b> Autopay and savings moves through the bank rails. Advisor handoff with a brief, rated by the advisors who receive it.</li></ul><p><b>Decision at day 90:</b> does a permissioned agent get more match captured, per participant, than the best nudge campaign Fidelity has run? If not, the thesis is wrong and we stop.</p>`,
  cut: () => `<h3>What I would cut</h3><ul><li><b>The general chatbot.</b> Free-text is a side door here, not the product. A coach that answers anything invites the questions it must not answer.</li><li><b>Budget categories and streaks.</b> They measure attention, not outcomes.</li><li><b>Investment selection.</b> Ever. That is what advisors are for, and the handoff is the feature.</li><li><b>A home screen with widgets.</b> The Overview exists because people expect it, and it is deliberately downstream.</li><li><b>Notifications that are not moments.</b> If Guardian would not let it through, it does not exist.</li></ul>`,
};
function renderNotes() {
  const el = document.getElementById('notesCol');
  const tabs = [['moment', S && S.tab !== 'penny' ? 'This tab' : 'This moment'], ['problem', 'Problem'], ['bet', 'Bet'], ['team', 'The team'], ['metrics', 'Metrics'], ['guardrails', 'Guardrails'], ['system', 'System'], ['ninety', '90 days'], ['cut', "What I'd cut"]];
  const cur = S ? S.notesTab : 'problem';
  el.innerHTML = `<div class="eyebrow">Product notes · for the reader, follows the thread</div><div class="notes-tabs">${tabs.map(([id, l]) => `<button class="${cur === id ? 'on' : ''}" data-note="${id}">${l}</button>`).join('')}</div><div class="note-body">${NOTES[cur]()}</div>`;
  el.querySelectorAll('[data-note]').forEach(b => b.onclick = () => { if (S) S.notesTab = b.dataset.note; else notesFallback = b.dataset.note; renderNotes(); });
}
let notesFallback = 'problem';

function choosePersona(pid) {
  S = freshState(pid);
  renderAll();
  setTimeout(startMoment, 350);
}
function renderAll() { renderTop(); renderPhone(); renderTeam(); renderNotes(); }
document.getElementById('notesFab').onclick = () => document.getElementById('notesCol').classList.toggle('open');

/* boot */
S = load();
renderAll();
</script>
