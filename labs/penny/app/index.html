/* Clean round ticks that always enclose the data: the smallest 1/2/2.5/5 step
   whose floor-to-ceiling range covers [min,max] in 2 to 5 intervals. */
function niceTicks(min, max) {
  if (!isFinite(min) || !isFinite(max)) return [0, 1];
  if (max === min) { const pad = Math.abs(max) * 0.5 || 1; min -= pad; max += pad; }

  for (let e = e0; e <= e0 + 3; e++) for (const m of [1, 2, 2.5, 5]) steps.push(m * Math.pow(10, e));
  steps.sort((a, b) => a - b);
  for (const step of steps) {
    const lo = Math.floor(min / step) * step, n = Math.round((Math.ceil(max / step) * step - lo) / step);
    if (n >= 2 && n <= 5) return Array.from({ length: n + 1 }, (_, i) => lo + i * step);

function cashflowChart(rows) {

  const top = ticks[ticks.length - 1], plot = H - T - B, y = v => T + plot * (1 - v / top);

  const groups = rows.map((r, i) => {
    const cx = L + band * i + band / 2, x1 = cx - bw - gap / 2, x2 = cx + gap / 2;
    const hIn = plot * r[1] / top, hOut = plot * r[2] / top, last = i === rows.length - 1;

}
/* A bar with a 4px rounded data-end and a square foot on the baseline. */

  const acts = S.actions.length ? `<div class="sec"><span class="cap">Actions</span>${S.actions.map(a => `<div class="ev"><span class="d">${esc(a.when)}</span><span><b>${esc(a.title)}</b> <span class="k">· ${a.status}</span><br><span class="sm">${a.log.map(esc).join(' · ')}</span>${a.status === 'applied' || a.status === 'scheduled' ? ` <button class="link" data-undo="${a.id}" style="font-size:13px">${a.status === 'scheduled' ? 'Cancel' : 'Undo'}</button>` : ''}</span></div>`).join('')}</div>` : '';

  const metric = `<div class="sec"><span class="cap">The measure</span><div class="tiles"><div class="tile"><span class="v num">${done}</span><span class="l">outcome-improving actions completed</span></div><div class="tile"><span class="v num">${undone}</span><span class="l">reversed</span></div><div class="tile"><span class="v num">${S.rules.length}</span><span class="l">standing rules</span></div></div><p class="xs">The north-star metric, counted from this log: an action counts only once Doer has done it and it has not been reversed within 30 days.</p></div>`;
  return `${acts}${metric}<div class="sec"><span class="cap">The whole story</span>${S.events.slice().reverse().map(e => `<div class="ev"><span class="d">${esc(e.d)}</span><span><span class="k">${K[e.k] || e.k}</span><br>${esc(e.t)}</span></div>`).join('')}</div><p class="xs">Everything Penny noticed, suggested, was allowed to do, and checked. A compliance reviewer sees this same list.</p>`;
}
/* ---------- You ---------- */
function renderYou() {
  const p = P();
  const team = [['Penny', 'talks with you, explains, remembers. Never computes a number, never moves money.'], ['Reader', 'reads your documents and cites the page.'], ['Analyst', 'turns 90 days of spending into essentials, free cash, runway.'], ['Planner', 'runs the calculators. Every number you see comes from here.'], ['Guardian', 'checks scope before anything reaches you, and decides when silence is right.'], ['Doer', 'the only one that can change anything, and only after you allow it.'], ['Watcher', 'checks your accounts between visits and verifies that actions landed.'], ['Advisor desk', 'books a licensed human when a question is theirs.']];
  return `<div class="sec"><span class="cap">What Penny knows</span><div>${S.memory.map((m, i) => `<div class="fact"><span>${esc(m[0])}</span><span class="src">${esc(m[1])} · <button class="link" data-forget="${i}">forget</button></span></div>`).join('')}</div></div>
    <div class="sec"><span class="cap">Rules</span><div class="rules"><div><span>Always</span><span>read your accounts and documents, run the numbers, prepare suggestions</span></div><div><span>Ask first</span><span>change a contribution, change an autopay, open or move savings, book an advisor</span></div><div><span>Quiet hours</span><span>nothing between 9pm and 7am; at most one message a week unless there is a real deadline or you ask. After two ignored messages Penny stops raising it.</span></div><div><span>Standing rules</span><span>${S.rules.length ? S.rules.map((r, i) => `${esc(r)} · <button class="link" data-revoke="${i}">revoke</button>`).join('<br>') : 'none'}</span></div><div><span>Never</span><span>move money without asking, pick funds, rank products, promise a return, sell you anything</span></div></div></div>
    <div class="sec"><span class="cap">What Penny can see</span><div>${(S.sources || p.sources).map(([n, w]) => `<div class="fact"><span>${esc(n)}</span><span class="src">${esc(w)}</span></div>`).join('')}</div><p class="xs"><button class="link" data-disconnect="1">Disconnect one</button> · <button class="link" data-export="1">What would leave</button> · <button class="link" data-forgetall="1">Delete everything</button></p></div>
    <div class="sec"><span class="cap">Who works on your money</span><div class="team">${team.map(([n, d]) => `<div><b>${n}</b><span>${d}</span></div>`).join('')}</div></div>`;
}

/* ---------- reviewer notes ---------- */
const NOTES = {
  journey: () => {
    const stage = { moment: ['The moment', 'No home screen. The first thing the customer sees is the number that matters today and the deadline attached to it. Finding the moment is the product; a dashboard is where good intentions go to be ignored.', ['Guard: only real deadlines, one message at a time, back off after two ignores.']],
      understand: ['Documents, not forms', 'Reader does the work and cites the page it came from. The customer corrects what is wrong; they never type what a document already says.', []],
      decide: ['One decision, in their numbers', 'One suggestion, three plain consequences, then a question about how the cost feels before anything happens. Tight changes the plan to a smaller step. Not sure gets the numbers to feel it with.', ['The cost is named out loud, including the part that gets worse.']],
      act: ['Permission as a calm sheet', 'What changes, what it costs, how to undo it. Allow, Not now, or hand over a standing rule. One result line, and an undo that tells the truth about what it can and cannot reverse.', []],
      away: ['Between sessions is the product', 'A raise, a balance-transfer offer, a recruiter, a car repair, a refinance letter. Each is one turn and one choice. Months with nothing worth saying collapse to a single line.', ['Metric: adherence at 90 days; reversal rate.']] };
    const tab = { money: ['Money', 'Accounts, three months of cash flow, spending you can tap to ask about, and the history behind it. Everything Analyst and Planner work from, shown as it stands today rather than frozen at sign-up.', []],
      plan: ['Plan', 'Sliders recompute the match, the take-home cost, the payoff and the ten-year line as you drag. Make this my plan hands the result to Penny, who still asks before doing anything. What-if scenarios show the difference, not a lecture.', []],
      activity: ['Activity', 'What Penny noticed, suggested, was allowed to do, checked, and what you asked. The north-star metric is counted off this same list, and a compliance reviewer reads exactly what you read.', []],
      you: ['You', 'Memory with sources, rules you can revoke, the data Penny can see and when it was last read, and the team that works on your money.', []] };
    const [h, body, bullets] = S && S.tab !== 'penny' ? tab[S.tab] : stage[S ? S.stage : 'moment'] || stage.moment;
    return `<h3>${h}</h3><p>${body}</p>${bullets.length ? `<ul>${bullets.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
      <p class="nlab">The five stages</p><div class="flow">${[['Moment', 'find it'], ['Understand', 'read, cite, confirm'], ['Decide', 'one choice, their numbers'], ['Act', 'permission, then do it'], ['Keep going', 'verify, notice, stay quiet']].map(([a, b], i) => `<div${S && S.tab === 'penny' && ['moment', 'understand', 'decide', 'act', 'away'][i] === S.stage ? ' class="on"' : ''}><b>${a}</b><span>${b}</span></div>`).join('')}</div>`;
  },
  vision: () => `<h3>The problem</h3><p>Most people know what would improve their finances. Most do not do it. The gap is not information: the decision is never framed in their own numbers, the action lives in a portal they dread, and nobody follows through.</p>
    <p class="nlab">The bet</p><p>A coach closes that gap if it finds the moment, frames one decision in the customer's numbers, asks how it feels, gets the action done with them, and keeps its word between sessions.</p>
    <p class="nlab">What it is not</p><ul><li>Not a chatbot with account access.</li><li>Not a budgeting app. Nobody was ever short of charts.</li><li>Not a robo-advisor. Penny never picks funds or ranks products.</li></ul>
    <p class="nlab">The unit of value</p><p>A completed action that improves an outcome. A conversation is a means, never the product.</p>`,
  personas: () => `<h3>Two customers, two different failures</h3>
    <p>Both are synthetic and internally consistent: every figure in the app is computed from the numbers below, not written by hand.</p>
    <p class="nlab">Jordan, 34 · mid career</p><p>Contributes 3% into a plan that matches 6%. Card at 24.99%. Saving for a first home. He acts when asked, then drifts. His journey runs six years and asks the harder question: can a coach hold a plan together across a raise, a card offer, a job wobble and a milestone?</p>
    <p class="nlab">Maya, 26 · early career</p><p>Eligible and not enrolled, 1,200 in savings, student loans, and afraid of locking money away. She has never acted. Her journey asks the first question: can a coach get one action out of someone the industry has never reached?</p>
    <p class="nlab">Why two</p><p>One tests sustained adherence, the other tests activation. A product that only does one of those is a feature.</p>`,
  agents: () => `<h3>Eight specialists, one conversation</h3>
    <p>The work is split so every step is separately checkable, and so the compliance surface is code rather than a prompt. The customer sees one voice; they can ask who did what at any point.</p>
    <div class="kv">${[['Penny', 'talks, explains, decides what to raise and when to stay quiet'], ['Reader', 'reads documents, cites the page'], ['Analyst', 'turns 90 days of spending into essentials, free cash, runway'], ['Planner', 'deterministic calculators — the only source of numbers'], ['Guardian', 'checks scope before anything reaches the customer'], ['Doer', 'the only agent that can change anything, and only after Allow'], ['Watcher', 'checks accounts between visits, verifies actions landed'], ['Advisor desk', 'hands off to a licensed human with a brief']].map(([a, b]) => `<div><b>${a}</b><span>${b}</span></div>`).join('')}</div>
    <p class="nlab">One turn, end to end</p>
    <div class="flow num">${['Watcher notices something real — a deadline, a paystub change, a charge — and wakes the loop.', 'Reader and Analyst assemble the facts, each with a source.', 'Planner runs the calculators and emits a fact sheet.', 'Penny writes the turn from that fact sheet. It may not compute.', 'Guardian checks scope, and holds anything out of bounds.', 'Doer acts, but only after the customer allows it.'].map(t => `<div><span>${t}</span></div>`).join('')}</div>
    <p class="nlab">The split that matters</p><p>The model handles sequencing, explanation, tone and timing. It does no arithmetic, selects no products, and takes no action. Every customer number comes from deterministic code a reviewer can read line by line.</p>`,
  memory: () => `<h3>Context that survives the session</h3>
    <p>A coach that forgets is a chatbot. Penny carries three kinds of memory, and every item shows where it came from and when.</p>
    <div class="kv">${[['Stated', 'what the customer said — a buffer, a goal, a worry'], ['Derived', 'what the numbers show — essentials, free cash, runway'], ['Documented', 'what a source says — plan document, p.12']].map(([a, b]) => `<div><b>${a}</b><span>${b}</span></div>`).join('')}</div>
    <p class="nlab">Between sessions</p><ul><li>The plan and every version of it, so a change is a decision with a date on it.</li><li>Standing rules the customer granted, revocable in one tap.</li><li>What was already suggested and declined, so Penny backs off instead of repeating itself.</li><li>Quiet hours, and a stop after two ignored messages.</li></ul>
    <p class="nlab">Correctable by design</p><p>Memory is visible in You. Any fact can be forgotten, and any source disconnected — after which anything that depended on it is marked stale rather than quietly re-guessed.</p>`,
  principles: () => `<h3>Design principles</h3><ul><li><b>One tap, one answer.</b> Every tap returns exactly one turn and offers the next step. Only the chips that open a tab navigate instead of answering.</li><li><b>Calm in the thread, depth in the tabs.</b> Penny carries one idea; Money, Plan and Activity carry the data.</li><li><b>Evidence on demand.</b> Who checked what is a question, not a banner.</li><li><b>Interactive where it teaches.</b> Sliders, tappable categories, what-if differences.</li><li><b>Hairlines, not boxes.</b></li></ul>
    <p class="nlab">Coaching voice</p><ul><li>Ask before telling. After a suggestion, one question about how it feels.</li><li>Offer a choice where one exists: 5% now, 6% in January.</li><li>"I would suggest" and "your call". Never "you should".</li><li>Name the cost, including the part that gets worse.</li><li>No guarantees. Projections are labelled assumptions.</li><li>Silence is a feature.</li></ul>`,
  guardrails: () => `<h3>What Penny will not do</h3><ul><li>Guidance yes; security selection, product ranking and individualized advice go to a licensed human with a brief the customer reads first.</li><li>The model never computes a customer number. Planner does.</li><li>Only Doer changes anything, after Allow. Every action is logged with who, when, and an undo.</li><li>Only real deadlines trigger a message. Quiet hours and a back-off after two ignores, both stated in You.</li><li>Memory is visible, cited, and can be forgotten or disconnected at the source.</li></ul>
    <p class="nlab">Checked, not promised</p><p>A free-text reply from the model is scanned before it is shown. Guarantee language, a named product or ticker, or any number the calculators did not produce holds the reply, falls back to the scripted answer, and is logged in Activity. In production that same check runs as an eval suite on every prompt change.</p>`,
  metrics: () => `<h3>North star</h3><p>Outcome-improving actions completed per active customer per quarter, counted only if the projection improves and the action is not reversed within 30 days. Activity counts it live, off the same log a compliance reviewer reads.</p>
    <p class="nlab">Guards</p><p>30-day reversal rate, escalation rate, complaint rate. A number that only goes up is a number nobody is checking.</p>
    <p class="nlab">By stage</p><p>Moment open rate; documents linked; feelings answered; decision to action; adherence at 90 days.</p>
    <p class="nlab">First 90 days</p><ul><li><b>Weeks 1–3:</b> the loop for real on one workplace plan; calculators reviewed with compliance; Doer wired to contribution changes only.</li><li><b>Weeks 4–8:</b> two cohorts of 200, unenrolled and under-contributing. Measure decision-to-action and 30-day reversals.</li><li><b>Weeks 9–12:</b> savings and autopay through bank rails; the advisor handoff rated by the advisors who receive it.</li></ul>
    <p class="nlab">The day-90 decision</p><p>Does a permissioned coach collect more match per participant than the best nudge campaign? If not, stop.</p>`,
};

    ${S ? `<div class="card"><span class="xs">The agents, right now</span>${Object.entries(S.team).map(([n, s]) => `<div class="team-row"><span>${n}</span><span class="st ${s === 'working' ? 'busy' : ''}">${esc(s)}</span></div>`).join('')}</div>
    <div class="card"><span class="xs">Try this</span><p class="sm">${S.persona === 'jordan' ? 'Tap <b>Show me</b>, then say how the cost feels. Allow both actions and keep skipping ahead — Jordan\'s story runs to 2032, through a raise, a card offer and a job wobble. Or ignore the path: ask Penny anything, or drag the sliders in Plan.' : 'Tap <b>Read my documents</b>, confirm what Penny found, then say how it feels. Allow both actions and keep skipping ahead — Maya\'s story runs to 2028, through a car repair and a refinance letter. Or ask Penny anything instead.'}</p><p class="xs">Free-text replies: ${sampleFn === undefined ? 'checking' : sampleFn && S.liveOn !== false ? 'live' : 'scripted'}, labelled either way.</p></div>` : ''}`;
  el.querySelectorAll('[data-note]').forEach(b => b.onclick = () => { if (S) S.notesTab = b.dataset.note; else notesFallback = b.dataset.note; renderNotes(); });
}
let notesFallback = 'vision';
/* On a wide screen the thinking is worth showing without a hunt for the button. */
if (window.innerWidth >= 1180) document.getElementById('notes').classList.add('open');
let startTimer = null;
function choose(pid) { clearTimeout(startTimer); S = fresh(pid); S.ph = null; renderAll(); startTimer = setTimeout(() => { if (S && !S.thread.length) startMoment(); }, 350); }

addEventListener('resize', fitPhone);

</script>
